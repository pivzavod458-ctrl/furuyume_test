<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Магазин</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f2f4f6;
            --text-color: #1a1a1a;
            --accent-color: #333333;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.4);
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%);
            background-attachment: fixed;
            color: var(--text-color);
            -webkit-font-smoothing: antialiased;
            padding-bottom: 90px;
        }

        h1, h2, h3 { margin: 0; font-weight: 700; }
        p { margin: 0; color: #555; }

        /* ПЛАВНОЕ ПЕРЕКЛЮЧЕНИЕ СТРАНИЦ */
        .page {
            display: none;
            padding: 20px;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .page.active {
            display: block;
            /* Небольшая задержка, чтобы display успел сработать */
            animation: fadeInPage 0.4s forwards; 
        }

        @keyframes fadeInPage {
            to { opacity: 1; transform: translateY(0); }
        }

        /* КАРТОЧКИ ТОВАРОВ */
        .products-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .product-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 10px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease;
        }
        .product-card:active { transform: scale(0.98); }

        .product-image {
            width: 100%;
            aspect-ratio: 1/1;
            background-color: #ddd;
            border-radius: 15px;
            margin-bottom: 10px;
            object-fit: cover;
            position: relative;
            overflow: hidden;
        }
        
        .img-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e0e0e0;
            color: #888;
            font-size: 24px;
        }

        .product-title {
            font-size: 13px;
            line-height: 1.2;
            margin-bottom: 5px;
            flex-grow: 1;
        }

        .product-price {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .add-btn {
            width: 100%;
            padding: 10px 0;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .add-btn:active { transform: scale(0.95); background: #000; }

        /* ПРОФИЛЬ */
        .profile-header {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            border: 1px solid var(--glass-border);
            margin-bottom: 20px;
        }
        .avatar {
            width: 80px;
            height: 80px;
            background: #333;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 30px;
        }

        /* КОРЗИНА */
        .cart-item {
            background: var(--glass-bg);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--glass-border);
            transition: transform 0.3s;
        }
        /* Анимация удаления */
        .cart-item.removing {
            transform: translateX(-100%);
            opacity: 0;
        }

        .total-block {
            margin-top: 20px;
            padding: 20px;
            background: white;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }
        .checkout-btn {
            background: #000;
            color: white;
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            font-size: 16px;
            margin-top: 10px;
            border: none;
            transition: transform 0.2s;
            cursor: pointer;
        }
        .checkout-btn:active { transform: scale(0.98); }

        /* НИЖНЕЕ МЕНЮ */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 25px;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            z-index: 1000;
        }

        .nav-item {
            color: #999;
            text-align: center;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        .nav-item i {
            font-size: 20px;
            margin-bottom: 4px;
            display: block;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .nav-item.active { color: #000; }
        .nav-item.active i { transform: translateY(-4px); }
        
        .cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #000;
            color: #fff;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .cart-badge.visible { opacity: 1; transform: scale(1); }

        /* ПЛАВНОЕ МОДАЛЬНОЕ ОКНО */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            z-index: 2000;
            
            /* Скрыто по умолчанию */
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: white;
            width: 80%;
            padding: 30px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            
            /* Анимация появления */
            transform: scale(0.8) translateY(20px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.open .modal {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .modal-btn {
            background: linear-gradient(45deg, #333, #000);
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            font-weight: bold;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .modal-btn:active { transform: scale(0.95); box-shadow: 0 5px 10px rgba(0,0,0,0.2); }

        .close-modal {
            margin-top: 15px;
            display: block;
            color: #999;
            font-size: 14px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .close-modal:hover { color: #333; }

    </style>
</head>
<body>

    <div id="home" class="page active">
        <h2 style="margin-bottom: 20px;">Каталог</h2>
        <div class="products-grid" id="products-container"></div>
    </div>

    <div id="cart" class="page">
        <h2 style="margin-bottom: 20px;">Корзина</h2>
        <div id="cart-items">
            <p style="text-align: center; margin-top: 50px; opacity: 0.5;">Ваша корзина пуста</p>
        </div>
        
        <div id="cart-total-block" class="total-block" style="display: none;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                <span>Итого:</span>
                <span id="total-price" style="font-weight: bold;">0 ₽</span>
            </div>
            <button class="checkout-btn" onclick="openCheckoutModal()">Оформить заказ</button>
        </div>
    </div>

    <div id="profile" class="page">
        <div class="profile-header">
            <div class="avatar"><i class="fas fa-user"></i></div>
            <h3 id="user-name">Guest User</h3>
            <p>Добро пожаловать в магазин</p>
        </div>
        <div style="background: var(--glass-bg); padding: 20px; border-radius: 20px; border: 1px solid var(--glass-border);">
            <h3>Мои заказы</h3>
            <p style="margin-top: 10px; font-size: 14px;">История заказов пуста.</p>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home', this)">
            <i class="fas fa-home"></i>
            <span>Главная</span>
        </div>
        <div class="nav-item" onclick="switchTab('cart', this)">
            <i class="fas fa-shopping-bag"></i>
            <span>Корзина</span>
            <div class="cart-badge" id="cart-badge">0</div>
        </div>
        <div class="nav-item" onclick="switchTab('profile', this)">
            <i class="fas fa-user"></i>
            <span>Профиль</span>
        </div>
    </div>

    <div class="modal-overlay" id="checkout-modal">
        <div class="modal">
            <i class="fas fa-paper-plane" style="font-size: 40px; margin-bottom: 20px; color: #333;"></i>
            <h3>Оформление</h3>
            <p style="margin-top: 10px;">Нажмите кнопку ниже, чтобы отправить список товаров менеджеру:</p>
            
            <a href="#" id="order-link" target="_blank" class="modal-btn">Написать @furuyumeorders</a>
            
            <span class="close-modal" onclick="closeCheckoutModal()">Закрыть</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 

        const user = tg.initDataUnsafe.user;
        if (user) {
            document.getElementById('user-name').innerText = user.first_name + ' ' + (user.last_name || '');
        }

        const products = [
            { id: 1, name: "Adidas Japan track jacket", price: 7600 },
            { id: 2, name: "Adidas x Yohji Yamamoto", price: 7200 },
            { id: 3, name: "Adidas Chinese jacket", price: 5700 },
            { id: 4, name: "VETEMENTS maroon bomber", price: 13200 }
        ];

        let cart = [];

        function renderProducts() {
            const container = document.getElementById('products-container');
            container.innerHTML = products.map(p => `
                <div class="product-card">
                    <div class="product-image">
                        <div class="img-placeholder"><i class="fas fa-tshirt"></i></div>
                    </div>
                    <div class="product-title">${p.name}</div>
                    <div class="product-price">${p.price} ₽</div>
                    <button class="add-btn" onclick="addToCart(${p.id}, this)">В корзину</button>
                </div>
            `).join('');
        }

        function addToCart(id, btnElement) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            
            // Анимация кнопки при нажатии
            const originalText = btnElement.innerText;
            btnElement.innerText = "Добавлено";
            btnElement.style.background = "#000";
            setTimeout(() => {
                btnElement.innerText = originalText;
                btnElement.style.background = "";
            }, 1000);

            updateCartUI();
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }

        function updateCartUI() {
            const badge = document.getElementById('cart-badge');
            badge.innerText = cart.length;
            if (cart.length > 0) badge.classList.add('visible');
            else badge.classList.remove('visible');

            const cartItemsContainer = document.getElementById('cart-items');
            const totalBlock = document.getElementById('cart-total-block');
            const totalPriceEl = document.getElementById('total-price');

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p style="text-align: center; margin-top: 50px; opacity: 0.5;">Ваша корзина пуста</p>';
                totalBlock.style.display = 'none';
            } else {
                totalBlock.style.display = 'block';
                let total = 0;
                cartItemsContainer.innerHTML = cart.map((item, index) => {
                    total += item.price;
                    return `
                        <div class="cart-item" id="item-${index}">
                            <div>
                                <div style="font-weight:bold; font-size: 14px;">${item.name}</div>
                                <div style="font-size: 12px; color: #666;">${item.price} ₽</div>
                            </div>
                            <i class="fas fa-trash" onclick="removeFromCart(${index})" style="color: #999; cursor: pointer; padding: 10px;"></i>
                        </div>
                    `;
                }).join('');
                totalPriceEl.innerText = total + ' ₽';
            }
        }

        function removeFromCart(index) {
            const itemElement = document.getElementById(`item-${index}`);
            itemElement.classList.add('removing');
            
            setTimeout(() => {
                cart.splice(index, 1);
                updateCartUI();
            }, 300); // Ждем окончания анимации
        }

        function switchTab(tabId, element) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            element.classList.add('active');

            if(tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        // --- ЛОГИКА ГЕНЕРАЦИИ ССЫЛКИ НА ОПЛАТУ ---
        function openCheckoutModal() {
            const modalOverlay = document.getElementById('checkout-modal');
            const orderLinkBtn = document.getElementById('order-link');
            
            // 1. Считаем сумму
            const total = cart.reduce((sum, item) => sum + item.price, 0);

            // 2. Формируем текст сообщения
            let message = "Здравствуйте! Я хочу оформить заказ:\n\n";
            cart.forEach((item, index) => {
                message += `${index + 1}. ${item.name} — ${item.price} руб.\n`;
            });
            message += `\n💰 Итого: ${total} руб.`;

            // 3. Кодируем текст для URL (чтобы спецсимволы и пробелы работали)
            const encodedMessage = encodeURIComponent(message);
            
            // 4. Вставляем в ссылку
            // Формат: https://t.me/USERNAME?text=MESSAGE
            orderLinkBtn.href = `https://t.me/furuyumeorders?text=${encodedMessage}`;

            // 5. Показываем окно (добавляем класс open для анимации)
            modalOverlay.classList.add('open');
            
            if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }

        function closeCheckoutModal() {
            document.getElementById('checkout-modal').classList.remove('open');
        }

        renderProducts();

    </script>
</body>
</html>
